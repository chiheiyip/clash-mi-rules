name: CI

on:
  push:
    branches: [ master ]
    paths:
      - '*.yaml'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [ master ]
    paths:
      - '*.yaml'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  schedule:
    # nightly rule-source availability check so a silently-broken mirror
    # (e.g. gh-proxy.com outage) surfaces even without a code change.
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_call:

jobs:
  validate:
    name: YAML + consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Offline validation (parse + structure + portability)
        run: python3 scripts/validate.py

  mihomo-test:
    # pinned = the kernel version the configs are known to work with (blocking).
    # latest = early warning for upcoming Mihomo releases (reported, non-blocking).
    name: Mihomo config test (${{ matrix.channel }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.channel == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        channel: [pinned, latest]
    env:
      MIHOMO_PINNED: v1.19.34
    steps:
      - uses: actions/checkout@v7
      - name: Fetch mihomo binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          mkdir -p bin
          if [ "${{ matrix.channel }}" = "pinned" ]; then
            ASSET_URL="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_PINNED}/mihomo-linux-amd64-${MIHOMO_PINNED}.gz"
          else
            ASSET_URL="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
              | jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-v[0-9]+\\.[0-9]+\\.[0-9]+\\.gz$")) | .browser_download_url' \
              | head -n1)"
          fi
          test -n "$ASSET_URL"
          curl -fsSL "$ASSET_URL" -o bin/mihomo.gz
          gunzip -f bin/mihomo.gz
          chmod +x bin/mihomo
          ./bin/mihomo -v
      - name: Kernel config test on sanitized copies
        run: bash scripts/mihomo_test.sh --bin "$PWD/bin/mihomo"

  rules-check:
    # Tags call this workflow to validate their configs; mirror availability
    # stays a separate check on master, pull requests and the nightly run.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    name: Rule URL availability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check all rule-provider + health URLs
        run: python3 scripts/check_rules.py
