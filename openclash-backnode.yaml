# ========================
# Clash-Mi 细化分流配置
# ========================
# 策略:url-test(自动测速) + fallback(故障转移),兼容 Clash Mi 内嵌 mihomo 内核。
#
# 分组结构:
#   AI:ChatGPT / Claude / Gemini / Grok / 其他AI(Meta AI、Copilot、Perplexity、Groq 等)
#   独立站点:GitHub / LinuxDo
#   社交:X / Instagram / Telegram / WhatsApp / Facebook / TikTok / Discord / Reddit
#   流媒体:Netflix / YouTube / Spotify / Stream Media(Disney、HBO、Amazon、Crunchyroll、Popcorn 等)
#   云与系统:Google / Microsoft / Apple / Nvidia / Cloud(Adobe 等)
#   游戏:Games(Steam、Epic、EA、Blizzard、UBI、PlayStation、Nintendo 等)
#   Crypto:Crypto(OKX、Bybit、Binance、Kraken、Bybit EU、Ether.fi、Trading 212、Monese、Myfin、Altery)
#   兜底:Test / 国外 / 国内 / 其他 / Block
#   地区组:所有-手动/自动,以及 香港/台湾/日本/新加坡/韩国/美国/英国/德国/其他(每组 手动+自动+故转)
#
# 规则来源:meta-rules-dat(.mrs) + blackmatrix7(.list),全部 URL 已验证可拉取。
# 机场订阅:把 proxy-providers 里的 机场订阅地址 换成你的真实订阅 URL。
# ========================

# 机场节点订阅
# 支持多机场:每个机场一个 provider 块,分别填入各自的订阅地址。
proxy-providers:

  # 机场A
  机场名称1:
    url: "机场A订阅地址"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

  # 机场B(不需要可删除本块)
  机场名称2:
    url: "机场B订阅地址"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}


# ========================
# 链式代理说明(socks5 / dialer-proxy)
# ========================
# 什么是链式代理?
#   让流量先走 A 节点、再由 A 转发到 B 节点 (两步跳),
#   适合“中转 + 落地分离”的机场玩法。
#
# dialer-proxy 是什么?
#   = 前置代理 / 链路的上游那一段。
#   例: dialer-proxy: 香港-自动
#      = 流量先连“香港-自动”(第一步),再由它去访问落地节点(第二步)。
#   值通常填一个地区组(香港-自动 / 美国-自动等)或某个具体节点名。
#
# 日常使用:绝大多数人用不到链式代理，保持整段注释即可,不影响任何功能。
# 需要启用时:去掉行首的 # (即取消注释),填好 server/port 等,并设置 dialer-proxy。
#
# 以下为 链式代理 socks5 节点,如果要启用,请去掉前面的 #
#  - name: 链式落地节点名称        # 这段链路的名字(自己起,如“中转-落地”)
#    type: socks5                 # 协议固定 socks5
#    server:                       # 落地节点域名或 IP
#    port:                         # 落地节点端口
#    username:                     # (可选)认证用户名,没有就留空
#    password:                     # (可选)认证密码,没有就留空
#    udp: true                     # 是否允许 UDP(游戏/通话建议 true)
#    dialer-proxy: 香港-自动       # 前置代理:先走“香港-自动”,再到上面的落地节点

# ========================
# 主要端口设置
# ========================
port: 7890
socks-port: 7891
mixed-port: 7893
redir-port: 7892
tproxy-port: 7895

allow-lan: true
mode: rule
log-level: info

external-controller: 0.0.0.0:9090
# 控制接口密码:请改为足够复杂的自定义密码(不要用 123456)
secret: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET"

# OpenClash 必设: 管理页 配置->DNS/运行 或 UCI 设置 router_self_proxy=0,
# 避免路由器本机的 scut_portal_login.sh / 联网检测 / 系统流量被透明代理。

# ========================
# DNS 设置
# ========================

# ========================
# 校园网出口节点 Listener (VLESS + WebSocket + Cloudflare Tunnel)
# ========================
# 此 listener 只在 Cudy 本机 127.0.0.1:10443 监听,不直接暴露公网。
# TLS 由前面的 Cloudflare Tunnel 终止(tunnel.freeapp.tech:443),Cloudflare 通过
# cloudflared 把 WebSocket 转到 Cudy 127.0.0.1:10443 的 VLESS+WS listener。
# Mihomo 的 VLESS Listener 设置非空 ws-path 即启用 WebSocket;
# allow-insecure: true 表示本机 listener 不启用 TLS(由 Cloudflare 终止)。
# 解密后连接固定走 `直连` 出站 -> 从校园网 WAN 发出。
# 注意:UUID 占位符,部署时替换为 XBoard 实际下发的用户 UUID(与节点下发一致)。
listeners:
  - name: vless-ws-in
    type: vless
    listen: 127.0.0.1
    port: 10443
    proxy: 直连
    users:
      - uuid: "YOUR_VLESS_UUID_PLACEHOLDER"
    ws-path: "/"
    allow-insecure: true

# ========================
# DNS 设置
# ========================
# 通用路由 DNS 策略(默认无接口绑定,兼容普通宽带 / PPPoE / Wi-Fi STA / USB WAN / 校园网等任意出口):
#   原则: DNS 上游静态、明确 —— nameserver / default-nameserver / proxy-server-nameserver /
#   direct-nameserver 一律用固定的公网 DNS 223.5.5.5 + 119.29.29.29,不使用由 WAN DHCP 动态
#   取得的网关 DNS;respect-rules 不启用。Mihomo 会根据当前系统路由表自动选择出口接口发送 DNS,
#   因此切到任何网络(普通宽带 / PPPoE / 其他 Wi-Fi STA / USB WAN / 校园网)都无需改 YAML。
#   - 校园网场景(当前 Cudy 出口为 apclix0):只要系统路由本身把这些公网 DNS 从 apclix0 发出即可。
#   - 排查/临时强制:若需强制 DNS 走某个指定接口,可临时把上游写成 "IP#接口" 形式(如
#     223.5.5.5#apclix0 / 119.29.29.29#apclix0),但这不应成为默认配置。
# 注意: dhcp:// 本身是 Mihomo 支持的合法 DNS 形式;但当 OpenClash 开启了 WAN DNS 追加 / DNS
# 覆写功能时,可能把 dhcp://apclix0 注入运行时配置,导致 7874 查询堆积 / DNS 超时 / 高 CPU。
# 若发现 /etc/openclash/openclash.yaml 出现 dhcp://apclix0,请在 OpenClash 设置中关闭
# ‘DNS 覆写 / 追加 WAN DNS’,而不是在源 YAML 里反复增加规则。
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - geosite:cn
    - s.scut.edu.cn
    - connect.rom.miui.com
    - +.msftconnecttest.com
    - +.msftncsi.com

ipv6: false

# ========================
# TUN 模块
# ========================
tun:
  enable: true
  stack: gvisor
  device: utun
  endpoint-independent-nat: true
  auto-route: false
  auto-detect-interface: false
  auto-redirect: false
  strict-route: false

profile:
  store-selected: true
  store-fake-ip: true

# ========================
# 策略组定义
# ========================
default: &default
  type: select
  proxies:
    - 所有-自动
    - 所有-手动
    - 香港-故转
    - 香港-手动
    - 台湾-故转
    - 台湾-手动
    - 日本-故转
    - 日本-手动
    - 新加坡-故转
    - 新加坡-手动
    - 韩国-故转
    - 韩国-手动
    - 美国-故转
    - 美国-手动
    - 英国-故转
    - 英国-手动
    - 德国-故转
    - 德国-手动
    - 其他-故转
    - 其他-手动
    - 直连
    - 拒绝

proxy-groups:

  # 业务分流组
  # ---- AI ----
  - {name: ChatGPT, <<: *default}
  - {name: Claude, <<: *default}
  - {name: Gemini, <<: *default}
  - {name: Grok, <<: *default}
  - {name: 其他AI, <<: *default}
  # ---- GitHub / LinuxDo ----
  - {name: GitHub, <<: *default}
  - {name: LinuxDo, <<: *default}
  # ---- 社交 ----
  - {name: X, <<: *default}
  - {name: Instagram, <<: *default}
  - {name: Telegram, <<: *default}
  - {name: WhatsApp, <<: *default}
  - {name: Facebook, <<: *default}
  - {name: TikTok, <<: *default}
  - {name: Discord, <<: *default}
  - {name: Reddit, <<: *default}
  # ---- 流媒体 ----
  - {name: Netflix, <<: *default}
  - {name: YouTube, <<: *default}
  - {name: Spotify, <<: *default}
  - {name: Stream Media, <<: *default}
  # ---- 云/系统 ----
  - {name: Google, <<: *default}
  - {name: Microsoft, <<: *default}
  - {name: Apple, <<: *default}
  - {name: Nvidia, <<: *default}
  - {name: Cloud, <<: *default}
  # ---- 游戏 ----
  - {name: Games, <<: *default}
  # ---- Crypto ----
  - {name: Crypto, <<: *default}
  # ---- 兜底 ----
  - {name: Test, <<: *default}
  - {name: 国外, <<: *default}
  # 国内组:默认直连(不走代理),保留手动切换选项
  - name: 国内
    type: select
    proxies:
      - 直连
      - 所有-自动
      - 所有-手动
      - 拒绝
  - {name: 其他, <<: *default}
  # Block 组:默认拒绝,不继承 default(后者默认走代理)
  - name: Block
    type: select
    proxies:
      - 拒绝
      - 直连
      - 所有-自动
      - 所有-手动

  # 全局手选/自动
  - name: 所有-手动
    type: select
    include-all: true
    filter: "^((?!(直连|拒绝)).)*$"

  - name: 所有-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "^((?!(直连|拒绝)).)*$"

  # 香港组
  - name: 香港-故转
    type: fallback
    interval: 180
    lazy: false
    proxies: [香港-手动, 香港-自动]
  - name: 香港-手动
    type: select
    include-all: true
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"
  - name: 香港-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"

  # 台湾组
  - name: 台湾-故转
    type: fallback
    interval: 180
    lazy: false
    proxies: [台湾-手动, 台湾-自动]
  - name: 台湾-手动
    type: select
    include-all: true
    filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan)).*$"
  - name: 台湾-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan)).*$"

  # 日本组
  - name: 日本-故转
    type: fallback
    interval: 180
    lazy: false
    proxies: [日本-手动, 日本-自动]
  - name: 日本-手动
    type: select
    include-all: true
    filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"
  - name: 日本-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"

  # 新加坡组
  - name: 新加坡-故转
    type: fallback
    interval: 180
    lazy: false
    proxies: [新加坡-手动, 新加坡-自动]
  - name: 新加坡-手动
    type: select
    include-all: true
    filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$"
  - name: 新加坡-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$"

  # 韩国组
  - name: 韩国-故转
    type: fallback
    interval: 180
    lazy: false
    proxies: [韩国-手动, 韩国-自动]
  - name: 韩国-手动
    type: select
    include-all: true
    filter: "(?=.*(广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea)).*$"
  - name: 韩国-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea)).*$"

  # 美国组
  - name: 美国-故转
    type: fallback
    interval: 180
    lazy: false
    proxies: [美国-手动, 美国-自动]
  - name: 美国-手动
    type: select
    include-all: true
    filter: "(?=.*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$"
  - name: 美国-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$"

  # 英国组
  - name: 英国-故转
    type: fallback
    interval: 180
    lazy: false
    proxies: [英国-手动, 英国-自动]
  - name: 英国-手动
    type: select
    include-all: true
    filter: "(?=.*(英国|英|伦敦|UK|United Kingdom|🇬🇧|London)).*$"
  - name: 英国-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(英国|英|伦敦|UK|United Kingdom|🇬🇧|London)).*$"

  # 德国组(新增)
  - name: 德国-故转
    type: fallback
    interval: 180
    lazy: false
    proxies: [德国-手动, 德国-自动]
  - name: 德国-手动
    type: select
    include-all: true
    filter: "(?=.*(广德|德国|德意志|DE|Germany|Frankfurt|法兰克福|法克福|🇩🇪|Düsseldorf|柏林|Berlin|慕尼黑|Munich)).*$"
  - name: 德国-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(广德|德国|德意志|DE|Germany|Frankfurt|法兰克福|法克福|🇩🇪|Düsseldorf|柏林|Berlin|慕尼黑|Munich)).*$"

  # 其他组(排除以上地区 + 直连/拒绝)
  - name: 其他-故转
    type: fallback
    interval: 180
    lazy: false
    proxies: [其他-手动, 其他-自动]
  - name: 其他-手动
    type: select
    include-all: true
    filter: "^((?!(直连|拒绝|广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea|广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States|英国|英|伦敦|UK|United Kingdom|🇬🇧|London|广德|德国|德意志|DE|Germany|Frankfurt|法兰克福|法克福|🇩🇪|Düsseldorf|柏林|Berlin|慕尼黑|Munich)).)*$"
  - name: 其他-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "^((?!(直连|拒绝|广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea|广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States|英国|英|伦敦|UK|United Kingdom|🇬🇧|London|广德|德国|德意志|DE|Germany|Frankfurt|法兰克福|法克福|🇩🇪|Düsseldorf|柏林|Berlin|慕尼黑|Munich)).)*$"

# ========================
# 规则引擎（rules）
# ========================
rules:
  # ---- 华南理工校园网认证 & 联网检测:最高优先级直连 (Portal/探测不代理) ----
  - DOMAIN,s.scut.edu.cn,直连
  - IP-CIDR,202.38.210.131/32,直连,no-resolve
  - DOMAIN,connect.rom.miui.com,直连
  - DOMAIN-SUFFIX,msftconnecttest.com,直连
  - DOMAIN-SUFFIX,msftncsi.com,直连
  # ---- 私网/内网 & 校园网基础设施:最高优先级直连 (避免内网 DNS 被代理) ----
  - IP-CIDR,10.0.0.0/8,直连,no-resolve
  - IP-CIDR,172.16.0.0/12,直连,no-resolve
  - IP-CIDR,192.168.0.0/16,直连,no-resolve
  - IP-CIDR,100.64.0.0/10,直连,no-resolve
  - IP-CIDR,127.0.0.0/8,直连,no-resolve
  - IP-CIDR,169.254.0.0/16,直连,no-resolve
  # ---- AI ----

  - RULE-SET,ChatGPT / Domain,ChatGPT
  - RULE-SET,Claude / Domain,Claude
  - RULE-SET,Gemini / Domain,Gemini
  - RULE-SET,Grok / Domain,Grok        # xAI 生态(grok.com / x.ai)
  # 其余 AI(Meta AI/Copilot/Perplexity/Groq 等)→ 其他AI 组
  - RULE-SET,Groq / Domain,其他AI
  - RULE-SET,Meta AI / Domain,其他AI
  - RULE-SET,Copilot / Domain,其他AI
  - RULE-SET,Perplexity / Domain,其他AI

  # ---- GitHub / LinuxDo ----
  - RULE-SET,GitHub / Domain,GitHub
  - RULE-SET,LinuxDo / Domain,LinuxDo

  # ---- 社交 ----
  - RULE-SET,X / Domain,X
  - RULE-SET,X / IP,X,no-resolve
  - RULE-SET,Instagram / Domain,Instagram
  - RULE-SET,Telegram / Domain,Telegram
  - RULE-SET,Telegram / IP,Telegram,no-resolve
  - RULE-SET,WhatsApp / Domain,WhatsApp
  - RULE-SET,Facebook / Domain,Facebook
  - RULE-SET,TikTok / Domain,TikTok
  - RULE-SET,Discord / Domain,Discord
  - RULE-SET,Reddit / Domain,Reddit

  # ---- 流媒体 ----
  - RULE-SET,Netflix / Domain,Netflix
  - RULE-SET,Netflix / IP,Netflix,no-resolve
  - RULE-SET,Youtube / Domain,YouTube
  - RULE-SET,Spotify / Domain,Spotify
